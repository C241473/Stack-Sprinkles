services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cloud-security-dashboard
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
